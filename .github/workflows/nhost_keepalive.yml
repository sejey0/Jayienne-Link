name: Keep Nhost Active

on:
  schedule:
    # Runs every 2 days at midnight UTC
    - cron: '0 0 */2 * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-nhost:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Nhost GraphQL Endpoint
        run: |
          curl -X POST "https://bopujszsgpxyiotttgte.graphql.ap-southeast-1.nhost.run/v1/graphql" \
            -H "Content-Type: application/json" \
            -H "x-hasura-admin-secret: ${{ secrets.NHOST_ADMIN_SECRET || 'JayienneLinkNhost2026Secret' }}" \
            -d '{"query":"query { __typename }"}' \
            --fail --silent --show-error
