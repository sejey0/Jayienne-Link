plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.jayiennelink.jayienne_link"
    compileSdk = 36
    buildToolsVersion = "35.0.0"
    ndkVersion = "28.2.13676358"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.jayiennelink.jayienne_link"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            // Faster debug builds
            shrinkResources false
            minifyEnabled false
            crunchPngs false
        }
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Custom Output APK Naming
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def buildType = variant.buildType.name
            if (buildType == "release") {
                outputFileName = "Jayienne Link.apk"
            } else {
                outputFileName = "Jayienne Link (${buildType}).apk"
            }
        }
    }

    // Auto-create named 'Jayienne Link.apk' on assembleRelease
    tasks.configureEach { task ->
        if (task.name == "assembleRelease") {
            task.doLast {
                def outDir = new File(project.buildDir, "outputs/flutter-apk")
                if (outDir.exists()) {
                    def src = new File(outDir, "app-release.apk")
                    def dest = new File(outDir, "Jayienne Link.apk")
                    if (src.exists()) {
                        dest.bytes = src.bytes
                    }
                }
            }
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

// Apply Firebase Google Services only when config file exists.
if (file("google-services.json").exists()) {
    apply plugin: "com.google.gms.google-services"
}
