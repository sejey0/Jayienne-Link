allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Expose Flutter SDK properties to all subprojects (needed by geolocator and other plugins)
ext {
    set('flutter', [
        compileSdkVersion: 35,
        targetSdkVersion: 35,
        minSdkVersion: 23
    ])
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force all subprojects (including plugins) to use Java 17
subprojects {
    pluginManager.withPlugin('com.android.library') {
        android {
            if (hasProperty('namespace')) {
                def current = namespace
                if (current == null || current.toString().trim().isEmpty()) {
                    def safeName = project.name.replace('-', '_')
                    namespace = "com.jayienne.${safeName}"
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    pluginManager.withPlugin('org.jetbrains.kotlin.android') {
        android {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
    pluginManager.withPlugin('kotlin-android') {
        android {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
