buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.google.gms:google-services:4.4.2'
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
}

// Expose Flutter SDK properties to all subprojects (needed by geolocator and other plugins)
ext {
    set('flutter', [
        compileSdkVersion: 36,
        targetSdkVersion: 35,
        minSdkVersion: 23
    ])
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force all subprojects (including plugins) to use compileSdk 36, Java 17 and configure namespace if missing
subprojects { project ->
    def configureAndroid = {
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null) {
            try {
                androidExt.compileSdkVersion 36
            } catch (Throwable ignored) {}
            try {
                androidExt.compileSdk = 36
            } catch (Throwable ignored) {}
            def currentNamespace = null
            try {
                currentNamespace = androidExt.namespace
            } catch (Throwable ignored) {
                currentNamespace = null
            }
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def safeName = project.name.replace('-', '_')
                androidExt.namespace = "com.jayienne.${safeName}"
            }
            try {
                androidExt.compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            } catch (Throwable ignored) {}
        }
    }

    if (project.state.executed) {
        configureAndroid()
    } else {
        project.afterEvaluate { configureAndroid() }
    }

    project.pluginManager.withPlugin('com.android.library') { configureAndroid() }
    project.pluginManager.withPlugin('com.android.application') { configureAndroid() }

    tasks.withType(JavaCompile).configureEach {
        sourceCompatibility = "17"
        targetCompatibility = "17"
    }
    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
        kotlinOptions {
            jvmTarget = "17"
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
