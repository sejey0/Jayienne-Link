allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://maven.google.com' }
    }
}

// Expose Flutter SDK properties to all subprojects (needed by geolocator and other plugins)
ext {
    set('flutter', [
        compileSdkVersion: 36,
        targetSdkVersion: 35,
        minSdkVersion: 23
    ])
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Force all subprojects (including plugins) to use Java 17
subprojects {
    pluginManager.withPlugin('com.android.library') {
        def androidExt = project.extensions.findByName('android')
        if (androidExt != null) {
            def currentNamespace = null
            try {
                currentNamespace = androidExt.namespace
            } catch (Throwable ignored) {
                currentNamespace = null
            }
            if (currentNamespace == null || currentNamespace.toString().trim().isEmpty()) {
                def safeName = project.name.replace('-', '_')
                androidExt.namespace = "com.jayienne.${safeName}"
            }
        }
        android {
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
        }
    }
    pluginManager.withPlugin('org.jetbrains.kotlin.android') {
        android {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
    pluginManager.withPlugin('kotlin-android') {
        android {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
