name: jayienne_link
description: "A couples connection app for staying linked with your person."
publish_to: "none"
version: 1.10.0+18

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^18.1.1

  # Supabase Backend Services
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^6.0.1

  # Firebase Realtime Engine (Live Location & Battery Telemetry)
  firebase_core: ^5.1.0
  firebase_database: ^13.0.1

  # Security & Storage
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  crypto: ^3.0.3
  flutter_cache_manager: ^3.3.1

  # Utilities
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.0
  share_plus: ^13.3.1
  image_picker: ^1.1.0
  cached_network_image: ^4.0.5
  shared_preferences: ^2.3.0
  image_gallery_saver: ^2.0.3
  image: ^4.1.0 # For Base64 image processing
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  record: ^7.1.2

  # OTA Auto Update & Network
  ota_update: ^7.1.0
  package_info_plus: ^10.2.2
  http: ^1.2.0

  # Location & Offline-First
  geolocator: ^14.1.2
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  connectivity_plus: ^7.3.1
  synchronized: ^3.1.0
  flutter_local_notifications: ^22.3.3
  permission_handler: ^12.0.3
  device_info_plus: ^13.3.0
  intl: ^0.20.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  workmanager: ^0.10.10
  battery_plus: ^7.1.2
  supabase: ^2.16.5
  minio_new: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  image_gallery_saver:
    path: third_party/image_gallery_saver
  permission_handler_android: 13.0.1
  mime: ^2.0.0
  intl: ^0.20.3
  http: ^1.6.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FF758C"
    theme_color: "#FF758C"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icon/
    - assets/data/
