name: jayienne_link
description: "A couples connection app for staying linked with your person."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Supabase Backend Services
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # Utilities
  share_plus: ^9.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.0
  image: ^4.1.0 # For Base64 image processing

  # Location & Offline-First
  geolocator: ^10.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  connectivity_plus: ^5.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.0.0
  intl: ^0.19.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  workmanager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/road_to_forever_full.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/road_to_forever_full.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
