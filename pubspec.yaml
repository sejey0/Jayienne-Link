name: jayienne_link
description: "A couples connection app for staying linked with your person."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_storage: ^12.1.0

  # Utilities
  share_plus: ^9.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.0

  # Location & Offline-First
  geolocator: ^10.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  connectivity_plus: ^5.0.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.0.0
  intl: ^0.19.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
