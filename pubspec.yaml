name: jayienne_link
description: "A couples connection app for staying linked with your person."
publish_to: "none"
version: 1.1.0+9

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Core
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.0
  flutter_animate: ^4.5.0

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.2.0

  # Supabase Backend Services
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # Firebase Realtime Engine (Live Location & Battery Telemetry)
  firebase_core: 3.4.0
  firebase_database: 11.0.0

  # Security & Storage
  flutter_secure_storage: ^9.0.0
  local_auth: ^2.2.0
  crypto: ^3.0.3
  flutter_cache_manager: ^3.3.1

  # Utilities
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.3.0
  image_gallery_saver: ^2.0.3
  image: ^4.1.0 # For Base64 image processing
  video_player: ^2.9.2
  audioplayers: ^6.0.0
  record: ^5.1.2

  # OTA Auto Update & Network
  ota_update: ^7.1.0
  package_info_plus: ^8.2.0
  http: ^1.2.0

  # Location & Offline-First
  geolocator: ^10.1.0
  sqflite: ^2.3.0
  path_provider: ^2.1.0
  path: ^1.9.0
  connectivity_plus: ^5.0.0
  synchronized: ^3.1.0
  flutter_local_notifications: ^17.0.0
  permission_handler: ^11.0.0
  device_info_plus: ^11.0.0
  intl: ^0.19.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  workmanager: ^0.9.0
  battery_plus: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

dependency_overrides:
  image_gallery_saver:
    path: third_party/image_gallery_saver
  record_platform_interface: 1.2.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "assets/icon/app_icon_background.png"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icon/
